<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarce</title>
    <link rel="stylesheet" href="rgsty.css">
</head>
<body>
    <header>

        <div class="logo">
            <h1>El Fichero</h1>
        </div>

        <nav>
             <button onclick="location.href='index.html'" class="BT">Inicio</button>
        </nav>
    </header>
    <div class="formulario-seccion">

    <h2>Registrate</h2>

    <form id="formularioContacto" novalidate>

        <!-- NOMBRE -->
        <div class="campo">
            <label for="nombre">Nombre:</label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                minlength="3"
                maxlength="30"
                required
                placeholder="Escribe tu nombre"
            >

            <small class="mensaje-error" id="errorNombre"></small>
        </div>


        <!-- APELLIDO -->
        <div class="campo">
            <label for="apellido">Apellido:</label>

            <input
                type="text"
                id="apellido"
                name="apellido"
                minlength="3"
                maxlength="30"
                required
                placeholder="Escribe tu apellido"
            >

            <small class="mensaje-error" id="errorApellido"></small>
        </div>


        <!-- EMAIL -->
        <div class="campo">
            <label for="email">Correo electrónico:</label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="100"
                required
                placeholder="ejemplo@correo.com"
            >

            <small class="mensaje-error" id="errorEmail"></small>
        </div>


        <!-- TELEFONO -->
        <div class="campo">
            <label for="telefono">Número de teléfono:</label>

            <input
                type="tel"
                id="telefono"
                name="telefono"
                minlength="7"
                maxlength="10"
                required
                placeholder="3001234567"
            >

            <small class="mensaje-error" id="errorTelefono"></small>
        </div>
        <!-- BOTON -->
        <button type="submit">
            Registrarse
        </button>

        <!-- MENSAJE FINAL -->
        <p id="mensajeExito"></p>

    </form>
 </div>
    <footer>

        <p>
            © 2026 El Fichero
        </p>

        <p>
            El mejor casino del mundo
        </p>
        <span>♤ ♥ ♢ ♧</span>

    </footer>
</body>
<script src="rgjs.js"></script>
</html>
